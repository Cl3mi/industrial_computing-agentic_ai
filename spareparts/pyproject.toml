[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spareparts"
version = "0.1.0"
description = "MCP server and ReAct agent for industrial spare-parts procurement"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.27,<2",
    "litellm>=1.105",
    "a2a-sdk[http-server]>=1.2.2,<2",
    "httpx>=0.28",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["mcp_server", "agent", "a2a_agents", "orchestrator"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
